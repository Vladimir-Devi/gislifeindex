    <g fill="#4f79a8">
      <circle cx="19" cy="74" r="5"/>
      <circle cx="68" cy="32" r="5"/>
      <circle cx="113" cy="74" r="5"/>
    </g>
    <g transform="translate(78 18)">
      <circle cx="22" cy="22" r="18" fill="#f7fbff" stroke="#4f79a8" stroke-width="3"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-labelledby="title desc">
  <title id="title">Indicator illustration</title>
  <desc id="desc">A raw measured value is converted into a readable 0 to 100 indicator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset=".55" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#edf2f5"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" x2="1">
      <stop offset="0" stop-color="#b6534d"/>
      <stop offset=".5" stop-color="#dfc85e"/>
      <stop offset="1" stop-color="#3f8277"/>
    </linearGradient>
    <filter id="hardShadow" x="-20%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="4" dy="5" stdDeviation="0" flood-color="#263033" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="420" height="180" rx="18" fill="url(#bg)"/>
  <g opacity=".12" stroke="#5f6b67">
    <path d="M24 44h372M24 92h372M24 140h372"/>
    <path d="M62 18v144M124 18v144M186 18v144M248 18v144M310 18v144M372 18v144"/>
  </g>


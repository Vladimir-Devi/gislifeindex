      <path d="M14 22h16M22 14v16" stroke="#4f79a8" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g stroke="#cfc5af" stroke-width="2" stroke-linecap="round">
      <path d="M20 88h92"/>
      <path d="M30 84v8M52 84v8M74 84v8M96 84v8"/>

    <path d="M217 61l15 10-17 8"/>
    <path d="M166 114c24 10 45 8 64-5"/>
    <path d="M216 103l17 5-13 13"/>
  </g>

  <g transform="translate(224 27)" filter="url(#hardShadow)">
    <rect width="66" height="112" rx="18" fill="#fffdf7" stroke="#d6c9b4"/>
    <g transform="translate(20 16)" stroke="#786b58" stroke-width="2" stroke-linecap="round">

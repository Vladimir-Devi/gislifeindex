<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-labelledby="title desc">
  <title id="title">Rank illustration</title>
  <desc id="desc">The selected quarter is placed among its neighbors in the rating table.</desc>

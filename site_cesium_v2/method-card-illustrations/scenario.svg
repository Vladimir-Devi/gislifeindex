<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" role="img" aria-labelledby="title desc">
  <title id="title">Scenario index illustration</title>
  <desc id="desc">Active index directions flow into a recalculated quarter score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset=".55" stop-color="#f8f2e7"/>
      <stop offset="1" stop-color="#e7f1ed"/>
    </linearGradient>
    <linearGradient id="scale" x1="0" x2="1">
      <stop offset="0" stop-color="#b6534d"/>
      <stop offset=".48" stop-color="#dfc85e"/>
      <stop offset="1" stop-color="#3f8277"/>
    </linearGradient>
    <filter id="hardShadow" x="-20%" y="-25%" width="150%" height="165%">
      <feDropShadow dx="4" dy="5" stdDeviation="0" flood-color="#1f2d2d" flood-opacity=".14"/>
    </filter>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#5a6763" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="420" height="180" rx="18" fill="url(#bg)"/>
  <rect x="10" y="10" width="400" height="160" rx="14" fill="url(#grid)"/>


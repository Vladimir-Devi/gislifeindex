<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D-карта индекса качества городской среды</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="src/styles.css?v=20260429-1000" />
    <link rel="stylesheet" href="src/map3d.css?v=20260429-1000" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button class="icon-button hidden" id="backButton" type="button" title="К городам">←</button>
        <div>
          <div class="eyebrow">ГИС-оценка качества городской среды</div>
          <h1 id="pageTitle">Города исследования</h1>
        </div>
        <a class="modeLink" href="2d.html">2D</a>
        <div class="topbarMetric" id="topMetric"></div>
      </header>

      <main>
        <section class="cityMenu" id="cityMenu">
          <article class="cityCard pkmn-card pkmn-card--rare" data-city="orel">
            <div class="cityCardTop">
              <h2 class="cityName">Орёл</h2>
              <div class="cityRating"><strong>50,15</strong><span>место 1</span></div>
            </div>
            <div class="crestSlot"><img src="public/herb_orel.png" alt="Герб Орла" loading="lazy"></div>
            <dl class="cityFacts">
              <div><dt>Жители</dt><dd>285 488</dd></div>
              <div><dt>Кварталы</dt><dd>344</dd></div>
              <div><dt>3D-здания</dt><dd>28 661</dd></div>
              <div><dt>Обзорные здания</dt><dd>4 240</dd></div>
              <div><dt>Хорошие кварталы</dt><dd>13,4%</dd></div>
            </dl>
          </article>
          <article class="cityCard pkmn-card pkmn-card--rare" data-city="tambov">
            <div class="cityCardTop">
              <h2 class="cityName">Тамбов</h2>
              <div class="cityRating"><strong>48,24</strong><span>место 2</span></div>
            </div>
            <div class="crestSlot"><img src="public/herb_tambov.png" alt="Герб Тамбова" loading="lazy"></div>
            <dl class="cityFacts">
              <div><dt>Жители</dt><dd>250 331</dd></div>
              <div><dt>Кварталы</dt><dd>391</dd></div>
              <div><dt>3D-здания</dt><dd>70 707</dd></div>
              <div><dt>Обзорные здания</dt><dd>2 014</dd></div>
              <div><dt>Хорошие кварталы</dt><dd>1,3%</dd></div>
            </dl>
          </article>
        </section>

        <section class="mapShell hidden mapShell3d" id="mapShell">
          <canvas id="baseCanvas"></canvas>
          <canvas id="glCanvas"></canvas>
          <canvas id="overlayCanvas"></canvas>

          <div class="mapControls">
            <button class="icon-button" id="resetView" type="button" title="Сбросить вид">⌂</button>
            <div class="controlGroup controlPanel" id="scenarioControls"></div>
            <div class="controlGroup controlPanel" id="layerControls"></div>
          </div>

          <aside class="infoPanel" id="infoPanel"></aside>
          <div class="legend" id="legend"></div>
          <div class="symbolLegend" id="symbolLegend"></div>
          <div class="accidentPopup hidden" id="accidentPopup"></div>
        </section>
      </main>
    </div>

    <script defer src="src/map3d.js?v=20260429-1000"></script>
  </body>
</html>

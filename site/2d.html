<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Индекс качества городской среды</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="src/styles.css?v=20260502-0100" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button class="icon-button hidden" id="backButton" type="button" title="К городам">←</button>
        <div>
          <div class="eyebrow">Оценка качества городской среды методами ГИС</div>
          <h1 id="pageTitle">Города исследования</h1>
        </div>
        <a class="modeLink" href="index.html">3D</a>
        <div class="topbarMetric" id="topMetric"></div>
      </header>

      <main>
        <section class="cityMenu" id="cityMenu"></section>

        <section class="mapShell hidden" id="mapShell">
          <canvas id="mapCanvas"></canvas>

          <div class="mapControls">
            <div class="controlGroup compact">
              <button class="icon-button" id="rotateLeft" type="button" title="Повернуть влево">↶</button>
              <button class="icon-button" id="rotateRight" type="button" title="Повернуть вправо">↷</button>
              <button class="icon-button" id="resetView" type="button" title="Сбросить вид">⌂</button>
            </div>
            <div class="controlGroup" id="scenarioControls"></div>
            <div class="controlGroup" id="layerControls"></div>
          </div>

          <aside class="infoPanel" id="infoPanel"></aside>
          <div class="legend" id="legend"></div>
          <div class="symbolLegend" id="symbolLegend"></div>
          <div class="accidentPopup hidden" id="accidentPopup"></div>
        </section>
      </main>
    </div>

    <script type="module" src="src/app.js?v=20260502-0100"></script>
  </body>
</html>

# Include this snippet only after the Nginx Brotli module is installed.
# On Ubuntu, first try:
#   apt update
#   apt install -y libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#
# Then add inside the server block:
#   include /etc/nginx/snippets/gislifeindex-brotli.conf;

brotli on;
brotli_static on;
brotli_comp_level 5;
brotli_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/geo+json
    image/svg+xml
    application/wasm;

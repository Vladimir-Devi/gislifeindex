server {
    listen 80;
    listen [::]:80;
    server_name gislifeindex.ru www.gislifeindex.ru 85.193.89.215;

    root /var/www/gislifeindex.ru;
    index index.html;
    charset utf-8;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/geo+json
        image/svg+xml
        application/wasm;
    gzip_static on;

    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /3d.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* ^/(manifest\.json|data/manifest\.json|data3d/manifest\.json)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* ^/(data|data3d|site_cesium_v2/data)/.+\.(json)$ {
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location ~* ^/(data|data3d|site_cesium_v2/data)/.+\.(b3dm|i3dm|bin|glb)$ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        try_files $uri =404;
    }

    location ~* ^/(src|public|vendor)/.+\.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
